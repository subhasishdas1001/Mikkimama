    <!-- Parallel Pre-Fetch of Live Server Store State Before React Mounts -->
    <script>
      window.__MIKKIMAMA_STORE_PROMISE__ = fetch('/api/store/state', { cache: 'no-store' })
        .then(function (r) {
          return r.ok ? r.json() : null;
        })
        .then(function (data) {
          if (data && typeof data === 'object') {
            window.__MIKKIMAMA_STORE__ = data;
          }
          return data;
        })
        .catch(function () {
          return null;
